<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="88" viewBox="0 0 1000 88" role="img" aria-label="Microsoft Agent Framework">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#151B2C"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="88" rx="16"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#0078D4" stop-opacity="0.45"/><stop offset="1" stop-color="#0078D4" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="88" fill="url(#base)"/>
<circle class="d0" cx="60" cy="44" r="220" fill="url(#o0)"/><circle class="d1" cx="940" cy="90" r="220" fill="url(#o1)"/>
<rect width="1000" height="44.0" fill="url(#sheen)"/>
<rect x="22" y="18" width="52" height="52" rx="12" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".14"/><rect x="35" y="31" width="11.96" height="11.96" fill="#F25022"/><rect x="49.04" y="31" width="11.96" height="11.96" fill="#7FBA00"/><rect x="35" y="45.04" width="11.96" height="11.96" fill="#00A4EF"/><rect x="49.04" y="45.04" width="11.96" height="11.96" fill="#FFB900"/><text x="94" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F0F6FC" >Microsoft Agent Framework</text><text x="94" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#9FB0C8" >Agent runtime limits, background tasks, streaming and providers</text>
</g>
<rect x=".5" y=".5" width="999" height="87" rx="15.5" fill="none" stroke="url(#edge)"/>
</svg>
