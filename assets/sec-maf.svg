<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="104" viewBox="0 0 1000 104" role="img" aria-label="Microsoft Agent Framework">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D1220"/><stop offset=".55" stop-color="#151B2C"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="104" rx="18"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#0369A1" stop-opacity="0.35"/><stop offset="1" stop-color="#0369A1" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="104" fill="url(#base)"/>
<circle class="d0" cx="860" cy="20" r="260" fill="url(#o0)"/><circle class="d1" cx="70" cy="52" r="160" fill="url(#o1)"/>
<rect width="1000" height="52.0" fill="url(#sheen)"/>
<rect x="26" y="22" width="60" height="60" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".14"/><rect x="41" y="37" width="13.8" height="13.8" fill="#F25022"/><rect x="57.2" y="37" width="13.8" height="13.8" fill="#7FBA00"/><rect x="41" y="53.2" width="13.8" height="13.8" fill="#00A4EF"/><rect x="57.2" y="53.2" width="13.8" height="13.8" fill="#FFB900"/><text x="106" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#F0F6FC" >Microsoft Agent Framework</text><text x="106" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9D4E5" >Agent runtime limits, background tasks, streaming and providers</text>
</g>
<rect x=".5" y=".5" width="999" height="103" rx="17.5" fill="none" stroke="url(#edge)"/>
</svg>
