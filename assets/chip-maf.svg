<svg xmlns="http://www.w3.org/2000/svg" width="248" height="40" viewBox="0 0 248 40" role="img" aria-label="Microsoft Agent Framework">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#151B2C"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="248" height="40" rx="12"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#0078D4" stop-opacity="0.55"/><stop offset="1" stop-color="#0078D4" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="248" height="40" fill="url(#base)"/>
<circle class="d0" cx="20" cy="20" r="60" fill="url(#o0)"/>
<rect width="248" height="20.0" fill="url(#sheen)"/>
<rect x="14" y="12" width="7.36" height="7.36" fill="#F25022"/><rect x="22.64" y="12" width="7.36" height="7.36" fill="#7FBA00"/><rect x="14" y="20.64" width="7.36" height="7.36" fill="#00A4EF"/><rect x="22.64" y="20.64" width="7.36" height="7.36" fill="#FFB900"/><text x="40" y="25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F0F6FC" >Microsoft Agent Framework</text>
</g>
<rect x=".5" y=".5" width="247" height="39" rx="11.5" fill="none" stroke="url(#edge)"/>
</svg>
