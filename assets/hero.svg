<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-label="Sai Karthik Thota">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D1220"/><stop offset=".55" stop-color="#151B2C"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="252" rx="22"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.3"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#EE4C2C" stop-opacity="0.22"/><stop offset="1" stop-color="#EE4C2C" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="252" fill="url(#base)"/>
<circle class="d0" cx="160" cy="40" r="300" fill="url(#o0)"/><circle class="d1" cx="780" cy="240" r="300" fill="url(#o1)"/>
<rect width="1000" height="126.0" fill="url(#sheen)"/>
<text x="500" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#F0F6FC" text-anchor="middle" letter-spacing="-1">Sai Karthik Thota</text><text x="500" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#C9D4E5" text-anchor="middle">I fix bugs and build features inside the tools AI engineers use</text><rect x="440" y="158" width="120" height="2" rx="1" fill="url(#line)"/><linearGradient id="line" gradientUnits="userSpaceOnUse" x1="440" x2="560"><stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FB7155"/></linearGradient><text x="500" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9FB0C8" text-anchor="middle">Final-year B.Tech CSE  ·  Indian Institute of Information Technology, Kottayam</text><text x="500" y="220" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#7DD3FC" text-anchor="middle">AI/ML Engineering  /  Research  /  Data Science  /  Software Engineering</text>
</g>
<rect x=".5" y=".5" width="999" height="251" rx="21.5" fill="none" stroke="url(#edge)"/>
