<svg xmlns="http://www.w3.org/2000/svg" width="128" height="42" viewBox="0 0 128 42" role="img" aria-label="LinkedIn">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#151B2C"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="128" height="42" rx="12"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#0A66C2" stop-opacity="0.6"/><stop offset="1" stop-color="#0A66C2" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="128" height="42" fill="url(#base)"/>
<circle class="d0" cx="20" cy="20" r="70" fill="url(#o0)"/>
<rect width="128" height="21.0" fill="url(#sheen)"/>
<rect x="16" y="12" width="18" height="18" rx="4" fill="#0A66C2"/><text x="25" y="26" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">in</text><text x="44" y="26" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#F0F6FC" >LinkedIn</text>
</g>
<rect x=".5" y=".5" width="127" height="41" rx="11.5" fill="none" stroke="url(#edge)"/>
</svg>
