<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-label="Projects">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D1220"/><stop offset=".55" stop-color="#151B2C"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="92" rx="18"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="92" fill="url(#base)"/>
<circle class="d0" cx="860" cy="20" r="240" fill="url(#o0)"/>
<rect width="1000" height="46.0" fill="url(#sheen)"/>
<rect x="28" y="24" width="5" height="44" rx="2.5" fill="#A78BFA"/><text x="50" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F0F6FC" >Projects</text><text x="50" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#C9D4E5" >Systems I designed, built and deployed</text>
</g>
<rect x=".5" y=".5" width="999" height="91" rx="17.5" fill="none" stroke="url(#edge)"/>
</svg>
