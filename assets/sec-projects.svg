<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-label="Projects">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1220"/><stop offset="1" stop-color="#151B2C"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="76" rx="16"/></clipPath>
<radialGradient id="o0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.18"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
</defs>
<style>
@media (prefers-reduced-motion: no-preference) {
.d0{animation:a 14s ease-in-out infinite alternate}
.d1{animation:b 18s ease-in-out infinite alternate}
.d2{animation:a 22s ease-in-out infinite alternate-reverse}
}
@keyframes a{to{transform:translate(40px,14px)}}
@keyframes b{to{transform:translate(-50px,-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="76" fill="url(#base)"/>
<circle class="d0" cx="60" cy="38" r="220" fill="url(#o0)"/><circle class="d1" cx="940" cy="80" r="220" fill="url(#o1)"/>
<rect width="1000" height="38.0" fill="url(#sheen)"/>
<rect x="24" y="20" width="4" height="36" rx="2" fill="#8B5CF6"/><text x="44" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F0F6FC" >Projects</text><text x="44" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9FB0C8" >Systems I designed, built and deployed</text>
</g>
<rect x=".5" y=".5" width="999" height="75" rx="15.5" fill="none" stroke="url(#edge)"/>
</svg>
